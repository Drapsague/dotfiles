set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:Tc"

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g prefix C-a
unbind C-b
bind-key C-a send prefix

unbind % 
bind ! split-window -h 

unbind '"'
bind - split-window -v

unbind r 
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on 

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

unbind -T copy-mode-vi MouseDragEnd1Pane

# List of tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'catppuccin/tmux#v2.1.2'


# Make the status line pretty and add some modules
# set -g status-right-length 100
# set -g status-left-length 100

# set -g status-left ''
# set -g status-right '#{E:@catppuccin_status_application}'
# set -ag status-right '#{E:@catppuccin_status_session}'

# Status bar
# set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-style 'bg=#000000,fg=#cdd6f4'

# Active/inactive windows
set -g window-status-format "#[fg=#cdd6f4,bg=#1e1e2e] #I #W "
set -g window-status-current-format "#[fg=#cdd6f4,bg=#313244] #I #W "

# Pane borders
# set -g pane-border-style 'fg=#C7C8CC'
set -g pane-border-style 'fg=#404258'
set -g pane-active-border-style 'fg=#404258'

# Message box (for prompts, etc.)
set -g message-style 'bg=#000000,fg=#cdd6f4'

bind - split-window -v -c '#{pane_current_path}'
bind ! split-window -h -c '#{pane_current_path}'

# Keep this line at the end of this file
run "~/.tmux/plugins/tpm/tpm"

